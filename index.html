<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIR CHIE DASHBOARD</title>
<style>
:root{--bg:#f4f6f7;--card:#fff;--ink:#14202a;--mute:#5d6b76;--line:#dde3e7;--acc:#0f6e66;--billed:#1f8f5f;--other:#d98a14;--bad:#c2410c}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10181d;--card:#172128;--ink:#e6edf1;--mute:#8fa1ad;--line:#26343d;--acc:#4cc2b5;--billed:#3ecf8e;--other:#f0a93a;--bad:#f08a5d}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px clamp(14px,4vw,40px) 48px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
h1{font-size:clamp(22px,3vw,30px);margin:0;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--other)}
.dot.ok{background:var(--billed)}.dot.err{background:var(--bad)}
button,select,input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 12px}
button{cursor:pointer}button:hover{border-color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:20px}
.kpi{background:var(--card);padding:14px 18px}
.kpi b{display:block;font-size:24px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi span{color:var(--mute);font-size:13px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tabs button{font-weight:600}
.tabs button[aria-selected=true]{border-color:var(--acc);color:var(--acc);box-shadow:inset 0 -2px 0 var(--acc)}
.tabs .cnt{display:inline-block;min-width:22px;text-align:center;margin-left:6px;padding:0 6px;border-radius:99px;background:var(--line);color:var(--mute);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.tabs button[aria-selected=true] .cnt{background:color-mix(in srgb,var(--acc) 20%,transparent);color:var(--acc)}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.tools input{flex:1;min-width:180px}
.bh{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:12px}.bh h2{font-size:18px;margin:0;white-space:nowrap}.bh .tools{margin-bottom:0;flex:1;min-width:260px}
.wrap{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--mute);font-weight:600;cursor:pointer;user-select:none;background:var(--card);position:sticky;top:0}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
tr.p{cursor:pointer}tr.p:hover td{background:color-mix(in srgb,var(--acc) 7%,transparent)}
tr.p td:first-child{font-weight:600}
.car{display:inline-block;width:14px;color:var(--mute);transition:transform .15s}
tr.open .car{transform:rotate(90deg)}
.bar{display:flex;height:8px;min-width:120px;border-radius:4px;overflow:hidden;background:var(--line)}
.bar i{display:block}
tr.d>td{padding:0;background:var(--bg)}
.det{max-height:340px;overflow:auto}
.det table{min-width:900px}.det th,.det td{font-size:13px;padding:6px 12px}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;color:#fff}
.fb{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--other);border-radius:12px;margin-bottom:20px;overflow:hidden}
.fb .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-right:18px}.fb h2{font-size:16px;margin:0;padding:14px 18px 4px}.fb p{margin:0;padding:0 18px 12px;color:var(--mute);font-size:13px}
.fb summary.hd{cursor:pointer;list-style:none;padding:12px 18px;user-select:none}.fb summary.hd::-webkit-details-marker{display:none}.fb summary h2{padding:0}.fb summary .meta{color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums;margin-left:auto;padding-right:6px}.fb[open] summary .car{transform:rotate(90deg)}.fb[open] summary.hd{border-bottom:1px solid var(--line)}.fb .det{max-height:380px}.fb .det table{min-width:860px}
tfoot td{font-weight:700;border-bottom:0}
.fb tfoot td{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line)}
.sync{display:flex;align-items:center;justify-content:center;gap:8px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:14px;font-weight:600;color:var(--billed)}
.act{display:flex;flex-direction:column;align-items:stretch;gap:8px}
.wm{background:#fff;width:0;min-width:100%;overflow:hidden;border:1px solid var(--line);border-radius:8px;padding:7px 0;pointer-events:none;user-select:none}
.trk{display:inline-block;padding-left:100%;white-space:nowrap;animation:run 6s linear infinite}
.trk .ai{color:#d00000;font-weight:inherit}
.trk span{font-weight:800;letter-spacing:.08em;color:#000;white-space:nowrap}
@keyframes run{to{transform:translateX(-100%)}}
.msg{padding:28px;text-align:center;color:var(--mute)}
.msg.err{color:var(--bad)}
</style>
</head>
<body>
<header>
  <div>
    <h1>SIR CHIE DASHBOARD</h1>
    <div class="sub"><span class="dot" id="dot"></span><span id="stamp">Loading…</span></div>
  </div>
  <div class="act"><div class="wm" aria-hidden="true"><div class="trk"><span>J<b class="ai">AI</b>SON</span></div></div><div class="sync" title="Syncs with Google Sheets automatically"><span class="dot ok"></span>Auto sync · Google Sheets</div></div>
</header>

<section class="kpis" id="kpis"></section>


<div class="wrap" id="wrap"><div id="out" class="msg">Loading data from Google Sheets…</div></div>

<div id="billing" style="margin-top:20px"><div class="bh"><h2>BILLING RECORDS</h2>
<div class="tools">
  <input id="q" type="search" placeholder="Search partner, name, account, serial…" aria-label="Search">
  <select id="st" aria-label="Filter by status"><option value="">All statuses</option></select>
  <button type="button" id="fbx">Export CSV</button>
</div>
</div><div id="fbsec"></div></div>

<script>
/* ====== SETTINGS ====== */
const SHEET_ID = "1L9Xjzn12HluxKvpyWhUQBvpduUqMhoo058fCTH_TdJE";
const GID = "0";            // tab ID: the number after gid= in the sheet URL
const POLL_SECONDS = 30;    // how often the dashboard checks for changes
/* ====================== */

const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString("en-PH",{maximumFractionDigits:2});
const peso = n => "₱" + fmt(n);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const FB = /for\s*billing/i;
const WC = /^(with\s*compliance|complied|compliant)$/i;
const isComp = r => WC.test((r.compliance || r.status || "").trim());
const NUM = new Set(["amount","fee","date"]);
function parseDate(t, dmy){
  const p = String(t).split("/").map(Number);
  if (p.length !== 3 || p.some(isNaN)) return 0;
  return Date.UTC(p[2], (dmy ? p[1] : p[0]) - 1, dmy ? p[0] : p[1]);
}
function sortRows(arr, st){
  if (!st.k) return arr;
  const g = r => st.k === "date" ? r.ts : NUM.has(st.k) ? r[st.k] : String(r[st.k] || "").toLowerCase();
  return arr.slice().sort((a,b) => {
    const x = g(a), y = g(b);
    return (typeof x === "number" ? x - y : x.localeCompare(y, undefined, {numeric:true})) * st.dir;
  });
}
const H = (t,k,l,c="") => { const st = t === "fb" ? fbSort : detSort; return `<th class="${c}" data-t="${t}" data-s="${k}">${l}${st.k === k ? (st.dir > 0 ? " ▲" : " ▼") : ""}</th>`; };
function sortBy(th){
  const st = th.dataset.t === "fb" ? fbSort : detSort, k = th.dataset.s;
  if (st.k === k) st.dir = -st.dir; else { st.k = k; st.dir = NUM.has(k) ? -1 : 1; }
  render();
}
const PALETTE = ["#d98a14","#c2410c","#6d5bd0","#2b7bb9","#a23b72","#7a8b2d"];

let fbSort = {k:"partner",dir:1}, detSort = {k:null,dir:1}, tab = "partners", hasComp = false, hasTag = false, fbExport = [], rows = [], lastHash = "", sortKey = "count", sortDir = -1, openSet = new Set(), fbOpen = new Set(["all"]);

function parseCSV(t){
  const out = []; let r = [], f = "", q = false;
  for (let i = 0; i < t.length; i++){
    const c = t[i];
    if (q){ if (c === '"'){ if (t[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ","){ r.push(f); f = ""; }
    else if (c === "\n"){ r.push(f); out.push(r); r = []; f = ""; }
    else if (c !== "\r") f += c;
  }
  if (f !== "" || r.length){ r.push(f); out.push(r); }
  return out;
}

/* Sheet has 2 blocks: A–L (with header row) and N–Y (no header row). Both use the same column order. */
function toRecords(grid){
  const recs = [];
  const hr = grid.find(c => c.some(x => /^partner name$/i.test(String(x).trim())));
  const tagIdx = hr ? hr.findIndex(x => /tag/i.test(String(x))) : -1;
  hasTag = tagIdx >= 0;
  const compIdx = hr ? hr.findIndex(x => /compliance/i.test(String(x))) : -1;
  hasComp = compIdx >= 0;
  const add = (c, o) => {
    const name = (c[o+1] || "").trim(), partner = (c[o+9] || "").trim();
    if (!name && !partner) return;
    if (name.toLowerCase() === "name" || partner.toLowerCase() === "partner name") return;
    recs.push({
      ts:parseDate((c[o]||"").trim(), o === 0), date:(c[o]||"").trim(), name, acct:(c[o+2]||"").trim(), serial:(c[o+3]||"").trim(),
      amount:parseFloat(String(c[o+4]||"").replace(/[^0-9.\-]/g,""))||0, ref:(c[o+5]||"").trim(),
      by:(c[o+6]||"").trim(), retailer:(c[o+7]||"").trim(), dealer:(c[o+8]||"").trim(),
      compliance: compIdx >= 0 ? String(c[compIdx] || "").trim() : "",
      tagging: tagIdx >= 0 ? String(c[tagIdx] || "").trim() : "",
      partner:partner || "(No partner)", status:(c[o+10]||"").trim() || "(Blank)",
      fee:parseFloat(String(c[o+11]||"").replace(/[^0-9.\-]/g,""))||0
    });
  };
  grid.forEach(c => { add(c, 0); if (c.length > 14) add(c, 13); });
  return recs;
}

function fetchGrid(){
  return new Promise((resolve, reject) => {
    const cb = "__gs" + Date.now();
    const sc = document.createElement("script");
    const done = () => { delete window[cb]; sc.remove(); };
    const timer = setTimeout(() => { done(); reject(new Error("Timeout. Check internet / sheet sharing")); }, 20000);
    window[cb] = r => {
      clearTimeout(timer); done();
      if (!r || r.status !== "ok") return reject(new Error((r && r.errors && r.errors[0] && r.errors[0].detailed_message) || "Sheet returned an error"));
      const grid = r.table.rows.map(row => (row.c || []).map(c => c ? (c.f != null ? c.f : (c.v != null ? c.v : "")) : ""));
      const labels = r.table.cols.map(c => c.label || "");
      if (labels.some(Boolean)) grid.unshift(labels);
      resolve(grid.map(a => a.map(String)));
    };
    sc.onerror = () => { clearTimeout(timer); done(); reject(new Error("Sheet is private. Share it as 'Anyone with the link' (Viewer)")); };
    sc.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:${cb}&gid=${GID}&headers=0&_=${Date.now()}`;
    document.head.appendChild(sc);
  });
}

async function load(manual){
  $("dot").className = "dot";
  try{
    const grid = await fetchGrid();
    const sig = JSON.stringify(grid);
    if (manual || sig !== lastHash){ lastHash = sig; rows = toRecords(grid); render(); }
    $("dot").className = "dot ok";
    $("stamp").textContent = "Live · updated " + new Date().toLocaleTimeString() + " · checks every " + POLL_SECONDS + "s";
  }catch(e){
    $("dot").className = "dot err";
    $("stamp").textContent = "Could not load: " + e.message;
    if (!rows.length) $("out").innerHTML = '<div class="msg err">Cannot read the sheet: ' + esc(e.message) + '.<br>In Google Sheets: Share → General access → "Anyone with the link" → Viewer.</div>';
  }
}

function statusColors(list){
  const m = {}; let i = 0;
  list.forEach(s => m[s] = /^billed$/i.test(s) ? "var(--billed)" : FB.test(s) ? "var(--other)" : PALETTE[i++ % PALETTE.length]);
  return m;
}

function render(){
  const statuses = [...new Set(rows.map(r => r.status))].sort((a,b) => (/^billed$/i.test(b)) - (/^billed$/i.test(a)) || FB.test(b) - FB.test(a) || a.localeCompare(b));
  const sel = $("st"), cur = sel.value;
  sel.innerHTML = '<option value="">All statuses</option>' + statuses.map(s => `<option ${s===cur?"selected":""}>${esc(s)}</option>`).join("");
  const colors = statusColors(statuses);
  const q = $("q").value.trim().toLowerCase(), f = sel.value;

  const data = rows.filter(r => (!f || r.status === f) &&
    (!q || [r.partner,r.name,r.acct,r.serial,r.ref,r.retailer,r.dealer,r.tagging].some(x => x.toLowerCase().includes(q))));

  const map = new Map();
  data.forEach(r => {
    const k = r.partner.toUpperCase();
    if (!map.has(k)) map.set(k, {name:r.partner, billed:0, cw:0, count:0, amount:0, fee:0, st:{}, items:[]});
    const p = map.get(k);
    if (/^billed$/i.test(r.status)) p.billed++;
    if (isComp(r)) p.cw++;
    p.count++; p.amount += r.amount; p.fee += r.fee; p.st[r.status] = (p.st[r.status]||0) + 1; p.items.push(r);
  });
  const parts = [...map.values()];
  parts.forEach(p => p.comp = p.count ? p.cw / p.count * 100 : 0);
  const key = sortKey;
  parts.sort((a,b) => {
    const av = key === "name" ? a.name.toLowerCase() : key.startsWith("s:") ? (a.st[key.slice(2)]||0) : a[key];
    const bv = key === "name" ? b.name.toLowerCase() : key.startsWith("s:") ? (b.st[key.slice(2)]||0) : b[key];
    return (av > bv ? 1 : av < bv ? -1 : 0) * sortDir;
  });

  const tot = {cw:data.filter(isComp).length, count:data.length, amount:0, fee:0, st:{}};
  data.forEach(r => { tot.amount += r.amount; tot.fee += r.fee; tot.st[r.status] = (tot.st[r.status]||0) + 1; });
  const billed = Object.entries(tot.st).filter(([s]) => /^billed$/i.test(s)).reduce((a,[,n]) => a+n, 0);

  const fbRows = sortRows(data.filter(r => FB.test(r.status)), fbSort);
  const fbAmt = fbRows.reduce((a,r) => a + r.amount, 0), fbFee = fbRows.reduce((a,r) => a + r.fee, 0);
  fbExport = data.slice().sort((x,y)=>x.partner.localeCompare(y.partner));

  $("kpis").innerHTML = [
    [fmt(parts.length), "Partners"], [fmt(tot.count), "Records"],
    [tot.count ? (billed/tot.count*100).toFixed(1) + "%" : "0%", "Billed"], [tot.count ? (tot.cw/tot.count*100).toFixed(1) + "%" : "0%", "With compliance"],
    [tot.count ? (fbRows.length/tot.count*100).toFixed(1) + "%" : "0%", "For billing"], [peso(tot.amount), "Amount paid"], [peso(tot.fee), "Admin fee"]
  ].map(([v,l]) => `<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join("");

  (() => {
    if (!data.length){ $("fbsec").innerHTML = ""; return; }
    const list = sortRows(data, fbSort);
    const a = list.reduce((x,r) => x + r.amount, 0), fe = list.reduce((x,r) => x + r.fee, 0);
    const label = f || "All statuses";
    $("fbsec").innerHTML = `<details class="fb" data-st="all" ${fbOpen.has("all") ? "open" : ""} style="border-left-color:${f ? colors[f] : "var(--acc)"}"><summary class="hd"><span class="car">▸</span><h2>${esc(label)} (${fmt(list.length)})</h2><span class="meta">${peso(a)}</span></summary>` +
      `<div class="det"><table><thead><tr>${H("fb","partner","Partner")}${H("fb","date","Date")}${H("fb","name","Name")}${H("fb","acct","Account no.")}${H("fb","serial","Serial no.")}${H("fb","amount","Amount","n")}${H("fb","ref","Ref no.")}${H("fb","retailer","Retailer")}${H("fb","dealer","Dealer")}${H("fb","status","Status")}${hasComp?H("fb","compliance","Compliance"):""}${hasTag?H("fb","tagging","Tagging"):""}${H("fb","fee","Fee","n")}</tr></thead><tbody>` +
      list.map(r => `<tr><td>${esc(r.partner)}</td><td>${esc(r.date)}</td><td>${esc(r.name)}</td><td>${esc(r.acct)}</td><td>${esc(r.serial)}</td><td class="n">${fmt(r.amount)}</td><td>${esc(r.ref)}</td><td>${esc(r.retailer)}</td><td>${esc(r.dealer)}</td><td><span class="tag" style="background:${colors[r.status]}">${esc(r.status)}</span></td>${hasComp?`<td>${esc(r.compliance)}</td>`:""}${hasTag?`<td>${esc(r.tagging)}</td>`:""}<td class="n">${fmt(r.fee)}</td></tr>`).join("") +
      `</tbody><tfoot><tr><td>Total</td><td></td><td></td><td></td><td></td><td class="n">${peso(a)}</td><td></td><td></td><td></td><td></td>${hasComp?"<td></td>":""}${hasTag?"<td></td>":""}<td class="n">${peso(fe)}</td></tr></tfoot></table></div></details>`;
  })();

  if (!parts.length){ $("out").className = "msg"; $("out").innerHTML = "No records match your filters."; return; }
  $("out").className = "";

  const arrow = k => sortKey === k ? (sortDir > 0 ? " ▲" : " ▼") : "";
  const th = (k, label, cls="") => `<th class="${cls}" data-k="${esc(k)}">${esc(label)}${arrow(k)}</th>`;
  let h = `<table><thead><tr>${th("name","Partner")}${th("count","Records","n")}` +
    statuses.map(s => th("s:"+s, s, "n")).join("") +
    `${th("amount","Amount paid","n")}${th("fee","Admin fee","n")}${th("comp","Compliance","n")}</tr></thead><tbody>`;
  parts.forEach(p => {
    const open = openSet.has(p.name);
    h += `<tr class="p ${open?"open":""}" data-p="${esc(p.name)}"><td><span class="car">▸</span>${esc(p.name)}</td><td class="n">${fmt(p.count)}</td>` +
      statuses.map(s => `<td class="n">${p.st[s] ? fmt(p.st[s]) : "–"}</td>`).join("") +
      `<td class="n">${peso(p.amount)}</td><td class="n">${peso(p.fee)}</td>` +
      `<td class="n" style="font-weight:700;color:var(--${p.comp>=90?"billed":p.comp>=70?"other":"bad"})">${p.comp.toFixed(1)}%</td></tr>`;
    if (open){
      h += `<tr class="d"><td colspan="${statuses.length+5}"><div class="det"><table><thead><tr>${H("d","date","Date")}${H("d","name","Name")}${H("d","acct","Account no.")}${H("d","serial","Serial no.")}${H("d","amount","Amount","n")}${H("d","ref","Ref no.")}${H("d","retailer","Retailer")}${H("d","dealer","Dealer")}${H("d","status","Status")}${hasComp?H("d","compliance","Compliance"):""}${hasTag?H("d","tagging","Tagging"):""}${H("d","fee","Fee","n")}</tr></thead><tbody>` +
        sortRows(p.items, detSort).map(r => `<tr><td>${esc(r.date)}</td><td>${esc(r.name)}</td><td>${esc(r.acct)}</td><td>${esc(r.serial)}</td><td class="n">${fmt(r.amount)}</td><td>${esc(r.ref)}</td><td>${esc(r.retailer)}</td><td>${esc(r.dealer)}</td><td><span class="tag" style="background:${colors[r.status]}">${esc(r.status)}</span></td>${hasComp?`<td>${esc(r.compliance)}</td>`:""}${hasTag?`<td>${esc(r.tagging)}</td>`:""}<td class="n">${fmt(r.fee)}</td></tr>`).join("") +
        `</tbody></table></div></td></tr>`;
    }
  });
  h += `</tbody><tfoot><tr><td>Total</td><td class="n">${fmt(tot.count)}</td>` +
    statuses.map(s => `<td class="n">${tot.st[s] ? fmt(tot.st[s]) : "–"}</td>`).join("") +
    `<td class="n">${peso(tot.amount)}</td><td class="n">${peso(tot.fee)}</td><td class="n">${tot.count ? (tot.cw/tot.count*100).toFixed(1) : "0.0"}%</td></tr></tfoot></table>`;
  $("out").innerHTML = h;
}

$("out").addEventListener("click", e => {
  const hs = e.target.closest("th[data-s]"); if (hs) return sortBy(hs);
  const t = e.target.closest("th[data-k]");
  if (t){ const k = t.dataset.k; sortDir = sortKey === k ? -sortDir : (k === "name" ? 1 : -1); sortKey = k; return render(); }
  const r = e.target.closest("tr.p");
  if (r){ const p = r.dataset.p; openSet.has(p) ? openSet.delete(p) : openSet.add(p); render(); }
});
$("fbsec").addEventListener("toggle", e => { const d = e.target; if (d.dataset && d.dataset.st !== undefined) d.open ? fbOpen.add(d.dataset.st) : fbOpen.delete(d.dataset.st); }, true);
$("fbsec").addEventListener("click", e => { const hs = e.target.closest("th[data-s]"); if (hs) sortBy(hs); });
function exportFB(){
  const head = ["Partner","Activation Date","Name","Account Number","Serial Number","Amount Paid","Ref Number","Activated By","Retailer","Dealer","Status","Admin Fee"].concat(hasComp ? ["Compliance"] : []).concat(hasTag ? ["Tagging"] : []);
  const q = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  const lines = [head.map(q).join(",")].concat(fbExport.map(r =>
    [r.partner,r.date,r.name,r.acct,r.serial,r.amount,r.ref,r.by,r.retailer,r.dealer,r.status,r.fee].concat(hasComp ? [r.compliance] : []).concat(hasTag ? [r.tagging] : []).map(q).join(",")));
  const blob = new Blob(["\ufeff" + lines.join("\r\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = ($("st").value ? $("st").value.toLowerCase().replace(/\s+/g,"-") : "all-records") + "-" + new Date().toISOString().slice(0,10) + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$("fbx").addEventListener("click", exportFB);
$("q").addEventListener("input", render);
$("st").addEventListener("change", render);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });

load(true);
setInterval(load, POLL_SECONDS * 1000);
</script>
